name: Import and keyboard WebKit

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: project-import-${{ github.ref }}
  cancel-in-progress: true

jobs:
  import-webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps webkit
      - run: npx playwright test --config e2e/project/playwright.config.ts --repeat-each=3
        env:
          PLAYWRIGHT_BASE_PATH: /ghost-rehearsal/
      - name: Upload import failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: project-import-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/import-webkit/
            test-results/import-webkit-results.json
          if-no-files-found: ignore
          retention-days: 14
